<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#171d1a" />
    <title>Clipping Studio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8843c'/%3E%3Cpath d='M11 8v16M11 16h10M21 8v16' stroke='%23171d1a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./youtube.css" />
    <link rel="stylesheet" href="./pipeline.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="i-dashboard" viewBox="0 0 24 24">
        <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" />
      </symbol>
      <symbol id="i-library" viewBox="0 0 24 24">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 5.5V21.5M8 7h8M8 11h8" />
      </symbol>
      <symbol id="i-jobs" viewBox="0 0 24 24">
        <path d="M12 7v5l3 2M12 3a9 9 0 1 0 9 9" />
        <path d="M17 3h4v4" />
      </symbol>
      <symbol id="i-clips" viewBox="0 0 24 24">
        <path d="M4 6h16v12H4zM8 6l2 4M14 6l2 4M6 18l2-4M16 18l2-4" />
      </symbol>
      <symbol id="i-providers" viewBox="0 0 24 24">
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 7v5h-5M4 17v-5h5" />
        <path d="M6.1 8a7 7 0 0 1 11.7-1L20 12M4 12l2.2 5a7 7 0 0 0 11.7-1" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m9 6 6 6-6 6" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="m8 5 11 7-11 7z" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 4v12M7 11l5 5 5-5M4 20h16" />
      </symbol>
      <symbol id="i-retry" viewBox="0 0 24 24">
        <path d="M20 7v5h-5M4 17v-5h5" />
        <path d="M6.1 8a7 7 0 0 1 11.7-1L20 12M4 12l2.2 5a7 7 0 0 0 11.7-1" />
      </symbol>
      <symbol id="i-cancel" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6 6 18" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-film" viewBox="0 0 24 24">
        <path d="M4 4h16v16H4zM8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4" />
      </symbol>
      <symbol id="i-spark" viewBox="0 0 24 24">
        <path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9z" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m16 16 5 5" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </symbol>
      <symbol id="i-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9S9.5 5.5 12 3z" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <path d="M9 9h10v10H9zM5 15V5h10" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <path d="M12 3 2.5 20h19zM12 9v4M12 17h.01" />
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 11v5M12 8h.01" />
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path d="M14 4h6v6M20 4l-8 8M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" />
      </symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24">
        <path d="M4 7h16M4 17h16M8 4v6M16 14v6" />
      </symbol>
      <symbol id="i-transcript" viewBox="0 0 24 24">
        <path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5" />
      </symbol>
    </svg>

    <a class="skip-link" href="#main">Skip to content</a>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
        <a class="brand" href="#/" aria-label="Clipping Studio home">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="brand-copy">
            <strong>Clipping Studio</strong>
            <small>local editing room</small>
          </span>
        </a>

        <nav class="nav-list" aria-label="Studio sections">
          <a class="nav-link" href="#/" data-nav="dashboard">
            <svg class="icon" aria-hidden="true"><use href="#i-dashboard"></use></svg>
            <span data-i18n="nav.dashboard">Dashboard</span>
          </a>
          <a class="nav-link" href="#/pipeline" data-nav="pipeline">
            <svg class="icon" aria-hidden="true"><use href="#i-link"></use></svg>
            <span id="nav-pipeline-label">Pipeline</span>
          </a>
          <a class="nav-link" href="#/library" data-nav="library">
            <svg class="icon" aria-hidden="true"><use href="#i-library"></use></svg>
            <span data-i18n="nav.library">Video library</span>
          </a>
          <a class="nav-link" href="#/jobs" data-nav="jobs">
            <svg class="icon" aria-hidden="true"><use href="#i-jobs"></use></svg>
            <span data-i18n="nav.jobs">Jobs monitor</span>
          </a>
          <a class="nav-link" href="#/clips" data-nav="clips">
            <svg class="icon" aria-hidden="true"><use href="#i-clips"></use></svg>
            <span data-i18n="nav.clips">Clip library</span>
          </a>
          <a class="nav-link" href="#/trash" data-nav="trash">
            <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg>
            <span data-i18n="nav.trash">Trash</span>
          </a>
          <a class="nav-link" href="#/providers" data-nav="providers">
            <svg class="icon" aria-hidden="true"><use href="#i-providers"></use></svg>
            <span data-i18n="nav.providers">Providers</span>
          </a>
          <a class="nav-link" href="#/skills" data-nav="skills">
            <svg class="icon" aria-hidden="true"><use href="#i-spark"></use></svg>
            <span data-i18n="nav.skills">Skills</span>
          </a>
        </nav>

        <div class="sidebar-note">
          <span class="sidebar-note-label" data-i18n="nav.localOnly">Local only</span>
          <p data-i18n="nav.localNote">Media and job data stay on this machine. No hosted editor.</p>
        </div>
      </aside>

      <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

      <div class="app-main">
        <header class="topbar">
          <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
            <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
          </button>

          <div class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
            <span data-i18n="nav.dashboard">Dashboard</span>
          </div>

          <div class="topbar-actions">
            <span class="system-pill" id="system-pill" title="Backend status">
              <span class="status-dot"></span>
              <span id="system-pill-text">Checking</span>
            </span>
            <button class="icon-button" id="lang-toggle" type="button" aria-label="Switch language" title="Switch language">
              <svg class="icon" aria-hidden="true"><use href="#i-globe"></use></svg>
              <span id="lang-label">AR</span>
            </button>
            <button class="icon-button" id="refresh-button" type="button" aria-label="Refresh view" title="Refresh view">
              <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
            </button>
          </div>
        </header>

        <main id="main" tabindex="-1">
          <div class="loading-state" aria-live="polite">
            <span class="loading-mark" aria-hidden="true"></span>
            <p>Loading studio…</p>
          </div>
        </main>
      </div>
    </div>

    <div class="toast-region" id="toast-region" role="status" aria-live="polite" aria-atomic="false"></div>
    <dialog class="studio-dialog" id="studio-dialog" aria-labelledby="dialog-title"></dialog>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
